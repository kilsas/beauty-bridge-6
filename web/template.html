<title>Beauty Bridge</title>
<meta name="description" content="Explainable cross-market beauty rankings and recommendations">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: a mobile-first shopping app column (max 720px) centred on a soft grey
   ground. Sticky header with main tabs and ranking sub-tabs; content is stacked
   sections of ranked product rows. Top three ranks sit in raised cards with medals. */
:root {
  --ground: #f3f3f6;
  --bg: #ffffff;
  --ink: #16151a;
  --ink-2: #47454f;
  --muted: #8d8b95;
  --line: #ededf1;
  --thumb: #f5f5f7;
  --accent: #8e2b63;
  --accent-ink: #ffffff;
  --accent-soft: #f8eaf2;
  --chip: #f2f2f5;
  --dark-chip: #2a2930;
  --dark-chip-ink: #ffffff;
  --up: #e5484d;
  --down: #3e7bfa;
  --good: #1f8a5b;
  --star: #f5a524;
  --gold: #f2c14e;
  --silver: #b9bdc6;
  --bronze: #c48b5c;
  --shadow: 0 1px 2px rgb(20 18 30 / 0.04), 0 4px 16px rgb(20 18 30 / 0.06);
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --num: "Outfit", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0c0b0e; --bg: #141317; --ink: #f2f1f5; --ink-2: #c8c6cf; --muted: #8d8b95;
    --line: #26242c; --thumb: #1f1d24; --accent: #e28cbc; --accent-ink: #1a1019; --accent-soft: #3a2231;
    --chip: #211f26; --dark-chip: #f2f1f5; --dark-chip-ink: #141317; --up: #ff6b6f; --down: #6f9dff;
    --good: #57c796; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0c0b0e; --bg: #141317; --ink: #f2f1f5; --ink-2: #c8c6cf; --muted: #8d8b95;
  --line: #26242c; --thumb: #1f1d24; --accent: #e28cbc; --accent-ink: #1a1019; --accent-soft: #3a2231;
  --chip: #211f26; --dark-chip: #f2f1f5; --dark-chip-ink: #141317; --up: #ff6b6f; --down: #6f9dff;
  --good: #57c796; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 720px; margin: 0 auto; background: var(--bg); min-height: 100vh; box-shadow: 0 0 0 1px var(--line); }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.hdr-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 6px; }
.logo { display: flex; align-items: center; gap: 7px; font: 600 19px/1 var(--num); letter-spacing: -0.03em; white-space: nowrap; flex: none; }
.logo svg { width: 24px; height: 24px; }
@media (max-width: 370px) { .logo span { display: none; } }
.tools { display: flex; align-items: center; gap: 2px; flex: none; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; }
.icon-btn:hover { background: var(--chip); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.8; }
.mkt { position: relative; display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.mkt:hover { background: var(--chip); }
.mkt svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.7; }
.mkt select { field-sizing: content; max-width: 96px; appearance: none; -webkit-appearance: none; background: transparent; border: 0; font: 500 14px var(--sans); color: var(--ink); padding-right: 14px; cursor: pointer; }
.mkt::after { content: ""; position: absolute; right: 9px; top: 50%; border: 4px solid transparent; border-top-color: var(--ink); transform: translateY(-2px); pointer-events: none; }
.lang { font: 600 12px var(--num); letter-spacing: 0.04em; padding: 6px 8px; border-radius: 8px; color: var(--muted); }
.lang:hover { background: var(--chip); color: var(--ink); }
.tabs { display: flex; gap: 22px; padding: 6px 16px 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { padding: 8px 0 10px; font-size: 16px; font-weight: 500; color: var(--ink-2); white-space: nowrap; position: relative; }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.sub { display: flex; gap: 22px; padding: 4px 16px 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.sub::-webkit-scrollbar { display: none; }
.sub button { padding: 10px 0 12px; font-size: 15px; color: var(--muted); white-space: nowrap; position: relative; }
.sub button[aria-current="true"] { color: var(--ink); font-weight: 700; }
.sub button[aria-current="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.hdr.flat { border-bottom: 1px solid var(--line); }

main { display: grid; gap: 0; }
main > *, .sec > *, .card > *, .two > *, .cards > *, .plist > * { min-width: 0; }
.app { overflow-x: clip; }
.sec { padding: 26px 16px; display: grid; gap: 14px; }
.sec + .sec { border-top: 8px solid var(--ground); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-h h2 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sec-h h2 em { font-style: normal; color: var(--accent); }
.sec-h .go { width: 28px; height: 28px; display: grid; place-items: center; }
.sec-h .go svg, .chev { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; }
.eyebrow { font-size: 12px; color: var(--muted); }
.updated { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
h1 { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--dark-chip); border-color: var(--dark-chip); color: var(--dark-chip-ink); font-weight: 700; }
.chip.drop { background: var(--dark-chip); border-color: var(--dark-chip); color: var(--dark-chip-ink); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.chip.drop::after { content: ""; border: 4.5px solid transparent; border-top-color: currentColor; transform: translateY(2px); }
.tag { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--ink-2); }

/* product rows */
.thumb { background: var(--thumb); border-radius: 10px; display: grid; place-items: center; flex: none; overflow: hidden; }
.thumb svg { width: 86%; height: 86%; }
.prow { display: grid; grid-template-columns: 34px 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; text-align: left; width: 100%; }
.prow .thumb { width: 64px; height: 64px; }
.prow.norank { grid-template-columns: 64px minmax(0, 1fr) auto; }
.rk { display: grid; justify-items: center; gap: 2px; }
.rk b { font: 600 18px/1 var(--num); font-variant-numeric: tabular-nums; }
.chg { font: 600 11px/1 var(--num); display: inline-flex; align-items: center; gap: 1px; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); } .chg.new { color: var(--accent); font-size: 10px; letter-spacing: .04em; }
.medal { width: 26px; height: 32px; }
.pinfo { min-width: 0; display: grid; gap: 3px; }
.pname { font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pname .br { color: var(--muted); margin-right: 4px; }
.rate { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.rate svg { width: 13px; height: 13px; fill: var(--star); }
.rate span { color: var(--muted); }
.metric { text-align: right; font-variant-numeric: tabular-nums; }
.metric b { font: 600 18px/1 var(--num); color: var(--accent); }
.metric small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.metric .save { color: var(--good); font-size: 11px; font-weight: 700; display: block; margin-top: 3px; }
.plist .prow + .prow { border-top: 1px solid var(--line); }
.cards { display: grid; gap: 12px; }
.cards .prow { background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px 14px 8px; border: 1px solid var(--line); }
.rows .prow { padding-left: 8px; padding-right: 8px; }

/* mini paged grid (home) */
.mini { display: grid; grid-template-rows: repeat(3, auto); grid-auto-flow: column; grid-auto-columns: minmax(min(84%, 300px), 1fr); column-gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.mini::-webkit-scrollbar { display: none; }
.mini .prow { scroll-snap-align: start; grid-template-columns: 30px 56px minmax(0, 1fr); padding: 8px 0; }
.mini .prow .thumb { width: 56px; height: 56px; }
.more { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--ink-2); display: flex; justify-content: center; align-items: center; gap: 4px; }
.more:hover { background: var(--chip); }
.more .chev { width: 14px; height: 14px; }

/* banner */
.banner { position: relative; margin: 8px 16px 0; }
.btrack { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 14px; scrollbar-width: none; }
.btrack::-webkit-scrollbar { display: none; }
.slide { scroll-snap-align: start; min-height: 190px; padding: 22px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 8px; align-items: end; text-align: left; color: #1a1420; }
.slide .k { font-size: 12px; font-weight: 700; opacity: .7; margin-bottom: 8px; display: block; }
.slide .h { font-size: clamp(19px, 4.6vw, 24px); font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; display: block; text-wrap: balance; }
.slide .s { font-size: 13px; opacity: .75; margin-top: 10px; display: block; }
.slide svg { width: 104px; height: 104px; }
.bcount { position: absolute; right: 14px; bottom: 14px; font: 600 11px var(--num); background: rgb(255 255 255 / .75); color: #1a1420; padding: 3px 8px; border-radius: 999px; }
.searchpill { margin: 14px 16px 0; display: flex; box-sizing: border-box; align-items: center; justify-content: space-between; background: var(--chip); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; width: calc(100% - 32px); }
.searchpill svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; }

/* rising carousel (home) */
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 42%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.pcard { scroll-snap-align: start; display: grid; gap: 8px; text-align: left; }
.pcard .thumb { aspect-ratio: 1; width: 100%; max-width: 100%; position: relative; }
.pcard .num { position: absolute; left: 10px; top: 8px; font: 700 22px var(--num); }
.pcard .chg { position: absolute; right: 10px; top: 12px; }

/* dupe pairs */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr); align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; width: 100%; }
.pair .side { display: grid; gap: 6px; min-width: 0; }
.pair .thumb { width: 100%; aspect-ratio: 1.3; max-width: 100%; }
.pair .arrow { text-align: center; font: 700 15px var(--num); color: var(--accent); }
.pair .arrow small { display: block; font: 500 10px var(--sans); color: var(--muted); }

/* brand blocks */
.brand { display: grid; gap: 4px; }
.brand-h { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.brand-h b { font: 600 18px var(--num); width: 22px; }
.blogo { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 700 11px var(--num); color: #fff; }
.brand-h .n { font-weight: 700; }
.brand-h .n span { color: var(--muted); font-weight: 500; margin-left: 4px; }

/* product page */
.phero { display: grid; gap: 16px; padding: 18px 16px 22px; }
.phero .thumb { width: 100%; max-width: 100%; aspect-ratio: 1.8; max-height: 280px; border-radius: 16px; }
.phero .thumb svg { width: 62%; height: 62%; }
.ptitle { display: grid; gap: 6px; }
.ptitle .br { color: var(--muted); font-size: 14px; }
.ptitle h1 { font-size: 22px; }
.ptitle .en { color: var(--muted); font-size: 13px; }
.price { font: 700 20px var(--num); font-variant-numeric: tabular-nums; }
.price small { font: 500 13px var(--sans); color: var(--muted); margin-left: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.profile { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 560px) { .profile { grid-template-columns: 1fr; } }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 8px; }
.scale div { height: 26px; border-radius: 5px; background: var(--chip); font-size: 11px; line-height: 26px; text-align: center; color: var(--muted); white-space: nowrap; overflow: hidden; }
.scale div.on { background: var(--ink); color: var(--bg); font-weight: 700; }
.ints { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; align-items: center; font-size: 13px; margin-top: 8px; }
.ints .d { display: inline-flex; gap: 4px; }
.ints i { width: 22px; height: 6px; border-radius: 3px; background: var(--chip); display: inline-block; }
.ints i.f { background: var(--accent); }
.lbl { font-size: 13px; font-weight: 700; }
.ptabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr-h, 100px)); z-index: 5; background: var(--bg); display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptabs button { padding: 12px 0; font-size: 15px; color: var(--muted); white-space: nowrap; position: relative; }
.ptabs button[aria-current="true"] { color: var(--ink); font-weight: 700; }
.ptabs button[aria-current="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.why { display: grid; gap: 14px; padding: 4px 8px 16px 50px; }
@media (max-width: 480px) { .why { padding-left: 8px; } }
.bars { display: grid; grid-template-columns: 5.6em minmax(50px, 1fr) 4.6em; gap: 6px 10px; align-items: center; font-size: 12px; }
.bars .t { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bars .t span { display: block; height: 100%; background: var(--accent); }
.bars .p { text-align: right; font: 500 12px var(--num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bars .r { grid-column: 2 / 4; color: var(--muted); margin-top: -3px; }
.fuse { font-size: 12px; color: var(--muted); line-height: 1.7; }
.fuse b { color: var(--ink); font-weight: 500; font-family: var(--num); }
details.res > summary { list-style: none; cursor: pointer; }
details.res > summary::-webkit-details-marker { display: none; }
details.res + details.res { border-top: 1px solid var(--line); }
.whybtn { font-size: 11px; color: var(--muted); display: inline-flex; gap: 2px; align-items: center; }
details[open] .whybtn .chev { transform: rotate(180deg); }
.whybtn .chev { width: 12px; height: 12px; stroke: var(--muted); }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--chip); border-radius: 12px; padding: 12px; }
.stat span { font-size: 12px; color: var(--muted); }
.stat b { display: block; font: 700 20px var(--num); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; background: var(--thumb); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.best td { font-weight: 700; }
.av-high { color: var(--good); } .av-medium { color: var(--ink-2); } .av-low { color: var(--up); }
.note { font-size: 12px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--thumb); border-radius: 12px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; }
.two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.goalcard { text-align: left; }
.goalcard .thumbs { display: flex; gap: 6px; }
.goalcard .thumbs .thumb { width: 44px; height: 44px; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; }

/* insight */
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font: 11px var(--num); }
svg.chart text.v { fill: var(--ink); font-weight: 600; }
svg.chart line { stroke: var(--line); }
.tl { display: grid; }
.ev { display: grid; grid-template-columns: 5.6em minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ev:last-child { border-bottom: 0; }
.ev time { font: 500 13px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; }
.co { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-right: 6px; }
.co.sephora_korea { background: var(--chip); color: var(--ink-2); }
.co.cj_olive_young { background: var(--accent-soft); color: var(--accent); }
.src { font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.prose p { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
.warn { font-size: 12px; color: var(--up); }

/* search */
.sbox { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 12px; padding: 0 6px 0 14px; }
.sbox input { flex: 1; min-width: 0; border: 0; background: transparent; font: 16px var(--sans); color: var(--ink); padding: 13px 0; outline: none; }
.sbox button { width: 40px; height: 40px; display: grid; place-items: center; }
.sbox svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgb(10 8 14 / .45); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 720px; margin: 0 auto; background: var(--bg); border-radius: 20px 20px 0 0; max-height: 80vh; overflow-y: auto; padding: 10px 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
.acc { border-bottom: 1px solid var(--line); }
.acc > button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; font-size: 16px; }
.acc > button .chev { transition: transform .2s; }
.acc > button[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc .chips { flex-wrap: wrap; padding-bottom: 16px; }
footer { padding: 24px 16px 40px; font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 8px solid var(--ground); display: grid; gap: 8px; }
footer button { text-decoration: underline; text-underline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
.thumb.photo { background: #fff; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.langsel { position: relative; display: flex; align-items: center; padding: 6px 4px 6px 8px; border-radius: 8px; }
.langsel:hover { background: var(--chip); }
.langsel select { field-sizing: content; max-width: 72px; appearance: none; -webkit-appearance: none; background: transparent; border: 0; font: 600 12px var(--sans); color: var(--muted); padding-right: 12px; cursor: pointer; }
.langsel::after { content: ""; position: absolute; right: 5px; top: 50%; border: 3.5px solid transparent; border-top-color: var(--muted); transform: translateY(-1px); pointer-events: none; }
.areas { display: flex; gap: 8px; }
.area { flex: 1; padding: 10px 6px; border-radius: 12px; background: var(--chip); font-size: 14px; font-weight: 500; color: var(--ink-2); text-align: center; }
.area[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--accent); }

<script>
const D = /*__DATA__*/null;
/* Deployment settings (web/config.json or build-time environment): which review storage to use. */
const CFG = /*__CONFIG__*/{};
/*__I18N__*/

/* ---------------- state + routing ---------------- */
const S = { view: "home", rtab: "market", lmkt: "KR", cat: "", skin: "dry", goal: "aegyo_sal", area: "eye", pid: "P001", ptab: "similar",
  origin: "", q: "", market: "KR", lang: "ko", hcat: "", hskin: "dry", harea: "eye", hgoal: "aegyo_sal", gskin: "", sheet: false, open: {},
  age: "20s", draft: null };
/* Live first-party reviews (db capability). One document per reviewer: reviews/<uid> = {items: {productId: review}} */
const LIVE = { status: "loading", db: null, uid: null, canWrite: null, list: [], saving: false, msg: "" };
try {
  const saved = JSON.parse(localStorage.getItem("bb3") || "{}");
  if (saved.market !== undefined && saved.market in MKT_TX.en) S.market = saved.market;
  if (saved.lang in LANGS) S.lang = saved.lang;
} catch (e) {}
const persist = () => { try { localStorage.setItem("bb3", JSON.stringify({ market: S.market, lang: S.lang })); } catch (e) {} };
const MARKETS = ["", "KR", "US", "JP", "CN"];
const areaOf = (g) => D.goals[g].meta.area;

function toHash() {
  if (S.view === "product") return "product-" + S.pid;
  if (S.view === "goals") return "goal-" + S.goal;
  if (S.view === "ranking") return "ranking-" + S.rtab;
  return S.view === "home" ? "" : S.view;
}
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("product-") && D.products[h.slice(8)]) { S.view = "product"; S.pid = h.slice(8); }
  else if (h.startsWith("goal-") && D.goals[h.slice(5)]) { S.view = "goals"; S.goal = h.slice(5); S.area = areaOf(S.goal); }
  else if (h.startsWith("ranking-") && ["market", "rising", "category", "skin", "age", "goal", "brand"].includes(h.slice(8))) { S.view = "ranking"; S.rtab = h.slice(8); }
  else if (["ranking", "insight", "method", "search", "goals"].includes(h)) S.view = h;
  else S.view = "home";
}
function go(view, extra = {}) {
  Object.assign(S, { view }, extra);
  const h = toHash();
  if (location.hash.slice(1) !== h) { try { history.pushState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {} }
  render(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", () => { fromHash(); render(); });

/* ---------------- i18n helpers ---------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nice = (s) => String(s ?? "").replace(/_/g, " ");
const fmt = (str, o) => str.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const t = (k) => T[S.lang][k] ?? T.en[k] ?? k;
const isEn = () => S.lang === "en";
const tx = (map, key) => key == null ? "" : isEn() ? nice(key) : (TR[S.lang][map][key] || nice(key));
for (const [id, p] of Object.entries(D.products)) p.id = id;
const P = (id) => D.products[id];
const mktName = (m) => MKT_TX[S.lang][m];
const catName = (c) => tx("cat", c);
const grpName = (g) => tx("grp", g);
const skinName = (s) => tx("skin", s);
const areaName = (a) => AREA_TX[S.lang][a];
const brandName = (p) => S.lang === "ko" ? p.bko : p.brand;
const prodName = (p) => S.lang === "ko" ? p.ko : p.name;
function goalName(g) {
  const m = D.goals[g].meta;
  if (S.lang === "ko") return m.ko;
  if (S.lang === "en") return m.name;
  return GOAL_TX[g]?.[S.lang]?.[0] || m.name;
}
function goalDesc(g) {
  const m = D.goals[g].meta;
  if (S.lang === "en") return m.desc;
  if (S.lang === "ko") return GOAL_TX[g]?.ko || m.desc;
  return GOAL_TX[g]?.[S.lang]?.[1] || m.desc;
}
const fmtNum = (n) => Number(n).toLocaleString("en-US");
/* Prices follow the language: 한국어 → 원, English → $, 日本語 → 円, 中文 → 元 (rates in D.config.fxNote). */
const DISP = { ko: "KRW", en: "USD", ja: "JPY", zh: "CNY" };
function fmtIn(v, cur) {
  if (cur === "KRW") return S.lang === "ko" ? fmtNum(Math.round(v / 10) * 10) + "원" : "₩" + fmtNum(Math.round(v / 10) * 10);
  if (cur === "JPY") return "¥" + fmtNum(Math.round(v));
  if (cur === "CNY") return "¥" + fmtNum(Math.round(v));
  return "$" + Number(v).toFixed(2);
}
/* an amount already in USD (savings, converted prices) shown in the display currency */
function dp(vUsd) {
  if (vUsd == null || isNaN(vUsd)) return "–";
  const c = DISP[S.lang];
  return fmtIn(vUsd / D.config.fx[c], c);
}
/* a price in its own currency shown in the display currency; "≈" marks a conversion */
function dpFrom(v, cur) {
  if (v == null) return "–";
  const c = DISP[S.lang];
  return cur === c ? fmtIn(v, c) : "≈" + fmtIn(v * D.config.fx[cur] / D.config.fx[c], c);
}
/* the original price with its currency code, for the price table */
const money = (v, cur) => v == null ? "–" : `${cur} ${cur === "USD" || cur === "EUR" ? Number(v).toFixed(2) : fmtNum(Math.round(v))}`;
const usd = dp;
function listing(p) {
  const m = S.market || p.origin;
  return p.list.find((l) => l.m === m) || p.list.find((l) => l.m === p.origin) || null;
}
function localPrice(p) {
  const l = S.market ? p.list.find((x) => x.m === S.market && x.price != null) : null;
  return l ? dpFrom(l.price, l.cur) : dpFrom(p.price, p.cur);
}
const dateFmt = (d) => d ? d.replace(/-/g, ".") : "";
const available = (p) => !S.market || p.list.some((l) => l.m === S.market && l.av !== "none");
const avName = (a) => ({ high: t("avHigh"), medium: t("avMedium"), low: t("avLow"), none: "–" }[a] || a);
function bigWon(v) {
  if (v === "" || v == null) return "–";
  const x = +v, L = S.lang;
  const tr = Math.abs(x) >= 1e12;
  if (L === "en") return tr ? `₩${(x / 1e12).toFixed(2)}tn` : `₩${(x / 1e9).toFixed(1)}bn`;
  const u = { ko: ["조", "억"], zh: ["万亿", "亿"], ja: ["兆", "億"] }[L];
  return tr ? `${(x / 1e12).toFixed(2)}${u[0]}` : `${fmtNum(Math.round(x / 1e8))}${u[1]}`;
}

/* ---------------- icons ---------------- */
const I = {
  search: `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,
  globe: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>`,
  chev: `<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`,
  right: `<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>`,
  star: `<svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.3l-5.6 2.9 1.1-6.3-4.6-4.4 6.3-.9z"/></svg>`,
  logo: `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="16" r="8.5" fill="none" stroke="var(--accent)" stroke-width="3"/><circle cx="21" cy="16" r="8.5" fill="none" stroke="var(--ink)" stroke-width="3"/></svg>`,
};
function medal(n) {
  const col = ["var(--gold)", "var(--silver)", "var(--bronze)"][n - 1];
  return `<svg class="medal" viewBox="0 0 26 32" aria-label="${n}"><path d="M7 0h12v9l-6 3-6-3z" fill="${col}" opacity=".75"/><circle cx="13" cy="19" r="10" fill="${col}"/><text x="13" y="23" text-anchor="middle" font-family="Outfit, sans-serif" font-size="11" font-weight="700" fill="#fff">${n}</text></svg>`;
}
function change(chg, st) {
  if (st === "new") return `<span class="chg new">NEW</span>`;
  if (!chg) return "";
  return chg > 0 ? `<span class="chg up">▲${chg}</span>` : `<span class="chg down">▼${-chg}</span>`;
}

/* ---------------- product pictures ---------------- */
const SHADE = { nude: "#d9a88c", rose: "#d98a95", pink: "#f0a3b6", coral: "#f08a6e", red: "#c23b3b", berry: "#8e3057", brown: "#9a6a52", champagne: "#e6cfa8", gold: "#d8b25a", clear: "#e7ecf1" };
function kindOf(p) {
  const c = p.cat, x = p.tex;
  if (c === "loose_powder") return "jar";
  if (c === "pressed_powder" || c === "cushion") return "compact";
  if (c === "foundation") return "pump";
  if (c === "mascara") return "mascara";
  if (c === "eyeliner") return x === "pencil" ? "pencil" : "pen";
  if (c === "brow") return x === "pencil" ? "pencil" : x === "gel" ? "mascara" : "jar";
  if (c === "lip_liner") return "pencil";
  if (c === "concealer" || c === "lip_tint" || c === "lip_gloss" || c === "lip_plumper") return x === "cream" ? "jar" : "wand";
  if (c === "primer" || c === "sunscreen" || c === "cleanser") return x === "liquid" ? "tall" : "tube";
  if (c === "setting_spray") return "spray";
  if (c === "lipstick") return x === "liquid" ? "wand" : "bullet";
  if (c === "lip_balm") return x === "balm" ? "tube" : "stick";
  if (c === "toner") return "tall";
  if (c === "serum") return "dropper";
  if (c === "moisturizer") return x === "gel" ? "tube" : "jar";
  if (c === "eyeshadow") return x === "liquid" ? "wand" : x === "cream" ? "jar" : "palette";
  if (x === "liquid") return "dropper";
  if (x === "stick") return "stick";
  if (x === "cream") return "jar";
  return "compact";
}
function thumbSvg(p) {
  const B = p.bcol, Sd = SHADE[p.shade] || (p.grp === "face_base" ? "#e9cdb5" : "#dfe8ef");
  const G = "#eef1f4", L = "#d6d3dc", W = "#fbfaf9";
  const ini = esc(p.brand.split(" ").map((w) => w[0]).join("").slice(0, 2));
  const lab = (x, y, w) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Outfit, sans-serif" font-size="${w}" font-weight="600" fill="${B}">${ini}</text>`;
  const shapes = {
    jar: `<rect x="26" y="30" width="48" height="16" rx="4" fill="${B}"/><rect x="28" y="46" width="44" height="34" rx="6" fill="${W}" stroke="${L}"/><rect x="28" y="58" width="44" height="9" fill="${Sd}"/>${lab(50, 76, 7)}`,
    compact: `<circle cx="50" cy="52" r="32" fill="${B}"/><circle cx="50" cy="52" r="23" fill="${Sd}"/><circle cx="41" cy="43" r="7" fill="#fff" opacity=".28"/>`,
    palette: `<rect x="16" y="28" width="68" height="46" rx="6" fill="${B}"/>${[[31, 44], [50, 44], [69, 44], [40, 60], [60, 60]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="8" fill="${Sd}" opacity="${1 - i * 0.14}"/>`).join("")}`,
    pump: `<rect x="40" y="16" width="24" height="7" rx="2" fill="${B}"/><rect x="60" y="17" width="10" height="3" rx="1" fill="${B}"/><rect x="44" y="23" width="12" height="11" fill="${B}"/><rect x="32" y="34" width="36" height="50" rx="7" fill="${W}" stroke="${L}"/><rect x="35" y="46" width="30" height="35" rx="5" fill="${Sd}"/>${lab(50, 68, 8)}`,
    dropper: `<rect x="44" y="12" width="12" height="20" rx="6" fill="${B}"/><rect x="40" y="31" width="20" height="10" fill="${B}"/><rect x="33" y="41" width="34" height="45" rx="7" fill="${G}" stroke="${L}"/><rect x="35" y="55" width="30" height="29" rx="5" fill="${Sd}" opacity=".7"/><rect x="38" y="60" width="24" height="12" fill="#fff" opacity=".9"/>${lab(50, 69, 7)}`,
    tall: `<rect x="41" y="12" width="18" height="14" rx="2" fill="${B}"/><rect x="36" y="26" width="28" height="62" rx="7" fill="${G}" stroke="${L}"/><rect x="38" y="48" width="24" height="22" fill="#fff"/>${lab(50, 62, 8)}`,
    tube: `<rect x="34" y="14" width="32" height="6" fill="#e3dfda"/><path d="M34 20h32l-4 54H38z" fill="${W}" stroke="${L}"/><rect x="37" y="36" width="26" height="5" fill="${Sd}"/>${lab(50, 56, 8)}<rect x="39" y="74" width="22" height="13" rx="2" fill="${B}"/>`,
    wand: `<rect x="42" y="10" width="16" height="36" rx="3" fill="${B}"/><rect x="42" y="46" width="16" height="42" rx="3" fill="${G}" stroke="${L}"/><rect x="44" y="50" width="12" height="34" rx="2" fill="${Sd}"/>`,
    bullet: `<path d="M42 44V26l16-7v25z" fill="${Sd}"/><rect x="40" y="44" width="20" height="10" fill="#d8c39a"/><rect x="38" y="54" width="24" height="34" rx="2" fill="${B}"/>`,
    stick: `<rect x="37" y="16" width="26" height="72" rx="7" fill="${B}"/><rect x="37" y="16" width="26" height="20" rx="7" fill="${Sd}"/><rect x="37" y="34" width="26" height="3" fill="#fff" opacity=".35"/>`,
    spray: `<rect x="43" y="20" width="14" height="14" fill="${B}"/><rect x="57" y="24" width="10" height="4" rx="1" fill="${B}"/><rect x="33" y="34" width="34" height="52" rx="10" fill="${G}" stroke="${L}"/><rect x="37" y="52" width="26" height="16" fill="#fff"/>${lab(50, 63, 8)}`,
    mascara: `<rect x="42" y="8" width="16" height="44" rx="3" fill="${B}"/><rect x="41" y="52" width="18" height="3" fill="#d8c39a"/><rect x="41" y="55" width="18" height="34" rx="4" fill="${B}" opacity=".82"/>${lab(50, 32, 6)}`,
    pen: `<rect x="45" y="10" width="10" height="32" rx="2" fill="${B}"/><rect x="45" y="42" width="10" height="38" rx="2" fill="#2b2a33"/><path d="M46.5 80h7L50 90z" fill="${Sd}"/>`,
    pencil: `<rect x="45" y="10" width="10" height="64" rx="2" fill="${B}"/><rect x="45" y="18" width="10" height="3" fill="#fff" opacity=".4"/><path d="M45 74h10l-5 12z" fill="#e6cfa8"/><path d="M48 82h4l-2 5z" fill="${Sd}"/>`,
  };
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${shapes[kindOf(p)]}</svg>`;
}
const pic = (p) => p.img ? `<img src="${p.img.src}" alt="${esc(p.brand + " " + p.name)}" loading="lazy">` : thumbSvg(p);
const thumb = (p) => `<span class="thumb${p.img ? " photo" : ""}">${pic(p)}</span>`;

/* ---------------- market signals (sourced awards / bestseller reports) ---------------- */
const sigMarket = () => S.market || S.lmkt;
function sigLabel(g) {
  const cat = SIG_CAT[S.lang][g.cat] || catName(g.cat);
  return `${SIG_SRC[g.src]?.[S.lang] || g.src} · ${cat}${g.rank ? " " + RANK_FMT[S.lang](g.rank) : ""}`;
}
const topSig = (p, m = sigMarket()) => (p.sig && p.sig[m] || [])[0];
function sigBadge(p) { const g = topSig(p); return g ? `<span class="sigb">${esc(sigLabel(g))}</span>` : ""; }
function leadersIn(m, cat) {
  return Object.keys(D.products).filter((id) => P(id).sig && P(id).sig[m] && (!cat || P(id).cat === cat || P(id).grp === cat))
    .sort((a, b) => P(b).sig[m][0].s - P(a).sig[m][0].s || a.localeCompare(b));
}
const countryChips = () => `<div class="chips">${["KR", "US", "JP", "CN"].map((m) => `<button class="chip" data-lmkt="${m}" aria-pressed="${S.lmkt === m}">${mktName(m)}</button>`).join("")}</div>`;

/* ---------------- rows ---------------- */
function rateLine(p) {
  const st = liveStats()[p.id];
  if (st) return `<span class="rate">${I.star}${st.mean.toFixed(2)} <span>(${fmtNum(st.n)})</span></span>`;
  const l = listing(p);
  if (!l || l.rating == null) return "";
  return `<span class="rate">${I.star}${Number(l.rating).toFixed(2)} <span>(${fmtNum(l.reviews ?? 0)})</span></span>`;
}
const nameLine = (p) => `<span class="pname"><span class="br">${esc(brandName(p))}</span>${esc(prodName(p))}</span>`;
function prow(id, n, { chg, st, metric = "", mini = false } = {}) {
  const p = P(id);
  const rank = n == null ? "" : n <= 3 && !mini ? `<span class="rk">${medal(n)}${change(chg, st)}</span>` : n <= 3 ? `<span class="rk">${medal(n)}</span>` : `<span class="rk"><b>${n}</b>${change(chg, st)}</span>`;
  return `<button class="prow${n == null ? " norank" : ""}" data-product="${id}">${rank}${thumb(p)}<span class="pinfo">${nameLine(p)}${rateLine(p)}${sigBadge(p)}</span>${mini ? "" : `<span class="metric">${metric}</span>`}</button>`;
}
function rankedList(ids, opts = {}) {
  if (!ids.length) return `<div class="empty">${t("noResult")}</div>`;
  const top = ids.slice(0, 3), rest = ids.slice(3, opts.limit || 20);
  const o = (id, i) => prow(id, i + 1, { ...(opts.extra ? opts.extra(id) : {}), metric: opts.metric ? opts.metric(id) : "" });
  return `<div class="cards">${top.map(o).join("")}</div>${rest.length ? `<div class="plist rows">${rest.map((id, i) => o(id, i + 3)).join("")}</div>` : ""}`;
}
function miniList(ids) {
  if (!ids.length) return `<div class="empty">${t("noResult")}</div>`;
  return `<div class="mini">${ids.slice(0, 6).map((id, i) => prow(id, i + 1, { mini: true })).join("")}</div>`;
}

/* ---------------- live review math (mirrors beautybridge/reviews.py) ---------------- */
const _cache = {};
function bayes(list) {
  const out = {};
  if (!list.length) return out;
  const W = D.reviewPrior.weight, m = list.reduce((a, r) => a + r.rating, 0) / list.length;
  for (const r of list) (out[r.product_id] ||= { n: 0, sum: 0 }), out[r.product_id].n++, out[r.product_id].sum += r.rating;
  for (const [id, o] of Object.entries(out)) { o.mean = o.sum / o.n; o.score = (W * m + o.sum) / (W + o.n); }
  return out;
}
function segStats(key, pred) {
  if (!_cache[key]) _cache[key] = bayes(pred ? LIVE.list.filter(pred) : LIVE.list);
  return _cache[key];
}
const liveStats = () => segStats("all");
function recompute() { for (const k of Object.keys(_cache)) delete _cache[k]; }
/* Rank candidate ids by review score within a reviewer segment; fall back to label fit when nobody has reviewed yet. */
function liveRank(ids, key, pred) {
  const st = segStats(key, pred);
  const reviewed = ids.filter((id) => st[id]).sort((a, b) => st[b].score - st[a].score || st[b].n - st[a].n || a.localeCompare(b));
  if (reviewed.length) return { ids: reviewed, live: true, n: reviewed.reduce((a, id) => a + st[id].n, 0) };
  const fit = (id) => (P(id).fits[0] || [0, 0])[1];
  return { ids: ids.slice().sort((a, b) => fit(b) - fit(a) || a.localeCompare(b)), live: false, n: 0 };
}
function liveTrending() {
  const now = Date.now(), win = D.reviewPrior.window * 864e5;
  const rec = {}, prev = {};
  for (const r of LIVE.list) {
    const age = now - Date.parse(r.created_at);
    if (!(age >= 0)) continue;
    if (age < win) rec[r.product_id] = (rec[r.product_id] || 0) + 1;
    else if (age < 2 * win) prev[r.product_id] = (prev[r.product_id] || 0) + 1;
  }
  return Object.keys(rec).map((id) => ({ id, recent: rec[id], prev: prev[id] || 0, growth: rec[id] - (prev[id] || 0) }))
    .sort((a, b) => b.growth - a.growth || b.recent - a.recent || a.id.localeCompare(b.id));
}

function reasonLocal(attr, ref, c) {
  const ph = PHR[S.lang];
  const same = (map, a, b) => a == null || b == null ? "–" : a === b ? fmt(ph.both, { x: tx(map, a) }) : `${tx(map, a)} · ${tx(map, b)}`;
  if (attr === "category") return ref.cat === c.cat ? fmt(ph.sameCat, { x: catName(c.cat) }) : `${catName(ref.cat)} · ${catName(c.cat)}`;
  if (attr === "finish") return same("finish", ref.finish, c.finish);
  if (attr === "coverage") return same("coverage", ref.cov, c.cov);
  if (attr === "texture") return same("texture", ref.tex, c.tex);
  if (attr === "skin_type") { const s = ref.skin.filter((x) => c.skin.includes(x)); return s.length ? ph.common + s.map(skinName).join(ph.sep) : ph.skinDiff; }
  if (attr === "price") return fmt(ph.price, { a: usd(ref.usd), b: usd(c.usd) });
  if (attr === "function") {
    const ks = D.codebook.intensity;
    const big = (k) => ref.int[k] != null && c.int[k] != null && Math.abs(ref.int[k] - c.int[k]) >= 2;
    const shared = ks.filter((k) => ref.int[k] > 0 && c.int[k] > 0 && !big(k)).map((k) => tx("feat", k));
    const diff = ks.filter(big).map((k) => tx("feat", k));
    return (shared.length ? ph.common + shared.join(ph.sep) : ph.noCommon) + (diff.length ? ph.diff + diff.join(ph.sep) : "");
  }
  return "";
}
function ruleParts(rule) {
  const isIn = rule.includes(" in ");
  const [f, rhs] = isIn ? rule.split(" in ") : rule.split(" ≈ ");
  const vals = isIn ? rhs.replace(/[\[\]']/g, "").split(",").map((s) => s.trim()) : [rhs];
  return { f, vals };
}
const trVal = (v) => isEn() ? nice(v) : (TR[S.lang].level[v] || TR[S.lang].finish[v] || TR[S.lang].coverage[v] || TR[S.lang].shade[v] || TR[S.lang].tone[v] || nice(v));
function goalReason(value, rule) {
  const { vals } = ruleParts(rule);
  if (isEn()) return `${nice(value)} · wants ${vals.map(nice).join(", ")}`;
  return fmt(PHR[S.lang].goal, { v: trVal(value), t: vals.map(trVal).join("·") });
}
function ruleLabel(rule) {
  const { f, vals } = ruleParts(rule);
  return `${tx("feat", f)} ${vals.map(trVal).join("·")}`;
}
function resultRows(list, kind, ref) {

  return list.map((r, i) => {
    const p = P(r.id), key = kind + r.id, open = S.open[key];
    const bars = r.x.map((x) => {
      const [a, pts, max] = x;
      const label = kind === "goal" ? tx("feat", a) : tx("attr", a);
      const why = kind === "goal" ? goalReason(x[3], x[4]) : isEn() ? nice(x[3]) : reasonLocal(a, ref, p);

const BACKEND = { kind: "", save: null };
function setReviews(list) { LIVE.list = list; LIVE.status = "ready"; recompute(); render(); }
async function saveReview(del = false) {

  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.forbidden)) { LIVE.canWrite = false; LIVE.msg = t("noWrite"); }

function cleanReview(pid, r, uid) {
  if (!D.products[pid] || !r || typeof r !== "object") return null;
  const rating = Number(r.rating);
  if (!Number.isInteger(rating) || rating < 1 || rating > 5) return null;
  const created = typeof r.created_at === "string" && !isNaN(Date.parse(r.created_at)) ? r.created_at : "1970-01-01T00:00:00Z";
  return { reviewer_id: uid, product_id: pid, rating, created_at: created,
    skin_type: D.codebook.skin.includes(r.skin_type) ? r.skin_type : null,
    age_band: D.reviewPrior.ages.includes(r.age_band) ? r.age_band : null,
    market: ["KR", "US", "JP", "CN"].includes(r.market) ? r.market : null,
    text: typeof r.text === "string" ? r.text.slice(0, D.reviewPrior.maxText) : "" };

/* 1) claude.ai viewer: the page's own shared database. One document per reviewer. */
async function initClaude(cl) {
  let db = null;
  try { db = await cl.use("db"); } catch (e) { db = null; }
  if (!db) return false;
  try {
    const user = await cl.use("user");
    LIVE.uid = user ? await user.id() : null;
    const c = user && typeof user.can === "function" ? await user.can("data.write") : null;
    LIVE.canWrite = c === false ? false : c === true ? true : null;
  } catch (e) { LIVE.uid = null; }
  BACKEND.kind = "claude";
  BACKEND.save = async (pid, review) => {
    const items = myItems();
    if (review) items[pid] = review; else delete items[pid];
    await db.doc("reviews/" + LIVE.uid).set({ items });
  };
  db.collection("reviews").onSnapshot((snap) => {
    const out = [];
    for (const doc of snap.docs) {
      const items = (doc.data() || {}).items;
      if (!items || typeof items !== "object") continue;
      for (const [pid, r] of Object.entries(items)) { const c = cleanReview(pid, r, doc.id); if (c) out.push(c); }
    }
    setReviews(out);
  }, () => { LIVE.status = LIVE.list.length ? "ready" : "nodb"; render(); });
  return true;
}

/* 2) Supabase (for GitHub Pages or any static host): anonymous sign-in, row-level security, realtime. */
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
function loadScript(src) {
  return new Promise((ok, fail) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = fail; document.head.appendChild(el); });
}
async function initSupabase(rc) {
  try {
    if (!window.supabase) await loadScript(SUPABASE_JS);
    const client = window.supabase.createClient(rc.supabaseUrl, rc.supabaseAnonKey);
    let session = (await client.auth.getSession()).data.session;
    if (!session) {
      const r = await client.auth.signInAnonymously();
      if (r.error) throw r.error;
      session = r.data.session;
    }
    LIVE.uid = session.user.id; LIVE.canWrite = true;
    const cols = "reviewer_id,product_id,rating,skin_type,age_band,market,text,created_at";
    const fetchAll = async () => {
      const out = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await client.from("reviews").select(cols).range(from, from + 999);
        if (error) throw error;
        for (const r of data) { const c = cleanReview(r.product_id, r, r.reviewer_id); if (c) out.push(c); }
        if (data.length < 1000) break;
      }
      setReviews(out);
    };
    await fetchAll();
    let pending = null;
    const refresh = () => { clearTimeout(pending); pending = setTimeout(() => fetchAll().catch(() => {}), 400); };
    client.channel("reviews-live").on("postgres_changes", { event: "*", schema: "public", table: "reviews" }, refresh).subscribe();
    setInterval(refresh, 60000);
    BACKEND.kind = "supabase";
    BACKEND.save = async (pid, review) => {
      const q = review
        ? client.from("reviews").upsert({ reviewer_id: LIVE.uid, product_id: pid, ...review }, { onConflict: "reviewer_id,product_id" })
        : client.from("reviews").delete().eq("reviewer_id", LIVE.uid).eq("product_id", pid);
      const { error } = await q;
      if (error) throw { forbidden: error.code === "42501", error };
      await fetchAll();
    };
    return true;
  } catch (e) {
    console.warn("review storage (Supabase) unavailable", e);
    return false;
  }
}

/* 3) Your own Beauty Bridge API server (beautybridge/api.py): polling, reviewer ids kept private. */
async function sha16(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
async function initApi(rc) {
  try {
    const base = rc.apiUrl.replace(/\/+$/, "");
    let rid = null;
    try { rid = localStorage.getItem("bb-reviewer"); } catch (e) {}
    if (!rid) { rid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); try { localStorage.setItem("bb-reviewer", rid); } catch (e) {} }
    LIVE.uid = await sha16(rid); LIVE.canWrite = true;
    const fetchAll = async () => {
      const res = await fetch(base + "/reviews");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();
      setReviews(rows.map((r) => cleanReview(r.product_id, r, r.reviewer_key)).filter(Boolean));
    };
    await fetchAll();
    setInterval(() => fetchAll().catch(() => {}), 20000);
    BACKEND.kind = "api";
    BACKEND.save = async (pid, review) => {
      const res = review
        ? await fetch(base + "/reviews", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reviewer_id: rid, product_id: pid, ...review }) })
        : await fetch(`${base}/reviews/${encodeURIComponent(rid)}/${encodeURIComponent(pid)}`, { method: "DELETE" });
      if (!res.ok) throw { forbidden: res.status === 403 };
      await fetchAll();
    };
    return true;
  } catch (e) {
    console.warn("review storage (API) unavailable", e);
    return false;
  }
}

async function initLive() {
  const cl = typeof window !== "undefined" ? window.claude : null;
  if (cl && typeof cl.use === "function" && await initClaude(cl)) return;
  const rc = CFG.reviews || {};
  if (rc.backend === "supabase" && rc.supabaseUrl && rc.supabaseAnonKey && await initSupabase(rc)) return;

/* ---------------- search (mirrors beautybridge/search.py) ---------------- */
function norm(s) { return String(s || "").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim(); }
const CJK = /[぀-ヿ㐀-鿿가-힣]/;
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function consume(text, phrase) {
  const p = norm(phrase); if (!p) return [false, text];
  const re = CJK.test(p) ? new RegExp(reEsc(p) + "[\\p{L}\\p{N}]*", "gu") : new RegExp("(?<![\\p{L}\\p{N}])" + reEsc(p) + "(?![\\p{L}\\p{N}])", "gu");
  const out = text.replace(re, " "); return [out !== text, out];
}
function parseQuery(q) {
  const r = { intent: "search", goal: null, category: null, origin: null, market: null, text: "" };
  let s = " " + norm(q) + " ", hit;
  const goalPhrases = (gid) => [D.goals[gid].meta.name, D.goals[gid].meta.ko, gid.replace(/_/g, " "), ...D.goals[gid].meta.al, GOAL_TX[gid]?.zh?.[0], GOAL_TX[gid]?.ja?.[0]].filter(Boolean);
  for (const gid of Object.keys(D.goals)) for (const ph of goalPhrases(gid)) { [hit, s] = consume(s, ph); if (hit) r.goal = gid; }
  for (const [m, phs] of Object.entries(D.query.market)) for (const ph of phs) { [hit, s] = consume(s, ph); if (hit) r.market = m; }
  for (const [o, phs] of Object.entries(D.query.origin)) for (const ph of phs) { [hit, s] = consume(s, ph); if (hit) r.origin = o; }
  for (const intent of ["cheaper", "similar"]) for (const ph of D.query.intent[intent]) { [hit, s] = consume(s, ph); if (hit && (r.intent === "search" || intent === "cheaper")) r.intent = intent; }
  const cats = Object.entries(D.query.category).flatMap(([c, phs]) => phs.map((ph) => [ph, c])).sort((a, b) => b[0].length - a[0].length);
  for (const [ph, c] of cats) { [hit, s] = consume(s, ph); if (hit && !r.category) r.category = c; }
  const stop = new Set(["a", "an", "the", "to", "for", "something", "product", "제품", "추천", "me", "i", "want", "推荐", "おすすめ"]);
  r.text = s.split(" ").filter((w) => w && !stop.has(w)).join(" ");
  if (r.goal && r.intent === "search") r.intent = "goal";
  return r;
}
function findProducts(text, f = {}) {
  const n = norm(text); if (!n) return [];
  const toks = n.split(" "), out = [];
  for (const [id, p] of Object.entries(D.products)) {
    if (f.category && p.cat !== f.category) continue;
    if (f.origin && p.origin !== f.origin) continue;
    const hay = norm([p.brand, p.bko, p.name, p.ko, ...(p.al || [])].join(" ")), words = hay.split(" ");
    const sc = hay.includes(n) ? 2 : toks.filter((tk) => words.some((w) => w.startsWith(tk) || (tk.length > 3 && w.startsWith(tk.slice(0, -1))))).length / toks.length;
    if (sc >= 0.5) out.push([sc, id]);
  }
  return out.sort((a, b) => b[0] - a[0] || a[1].localeCompare(b[1])).map((x) => x[1]);
}
const EXAMPLES = {
  ko: ["저렴한 한국 파우더 bake set 비슷한", "애교살 추천", "립 맥시마이저", "중국 쿠션"],
  en: ["cheap korean powder like bake set", "aegyo-sal", "lip plumper", "chinese cushion"],
  zh: ["韩国 散粉 平替 bake set", "卧蚕", "丰唇", "中国 气垫"],
  ja: ["韓国 パウダー プチプラ bake set", "涙袋", "リッププランパー", "中国 クッション"],
};
function vSearch() {
  const q = S.q.trim();
  let body = "";
  if (!q) body = `<p class="note">${t("openSearch")}</p>`;
  else {
    const pq = parseQuery(q);
    const wantsRef = pq.intent === "cheaper" || pq.intent === "similar";
    const f = wantsRef ? { category: pq.category } : { category: pq.category, origin: pq.origin };
    let hits = pq.text ? findProducts(pq.text, f) : [];
    if (!hits.length && pq.text) hits = findProducts(pq.text);
    if (!pq.text && !pq.goal && (pq.category || pq.origin)) hits = Object.keys(D.products).filter((id) => (!pq.category || P(id).cat === pq.category) && (!pq.origin || P(id).origin === pq.origin));
    const und = [pq.intent === "cheaper" && t("cheaper"), pq.intent === "similar" && t("similar"), pq.goal && goalName(pq.goal), pq.category && catName(pq.category), pq.origin && `${t("madeIn")} ${mktName(pq.origin)}`, pq.market && mktName(pq.market), pq.text && `“${pq.text}”`].filter(Boolean);
    body += `<div><span class="lbl">${t("understood")}</span><div class="rules" style="margin-top:8px">${und.map((u) => `<span class="tag">${esc(u)}</span>`).join("")}</div></div>`;
    if (pq.market && pq.market !== S.market) body += `<button class="more" data-setmarket="${pq.market}">${fmt(t("switchMkt"), { m: mktName(pq.market) })}</button>`;
    if (pq.goal) body += `<button class="card" data-goal="${pq.goal}" style="text-align:left"><span class="eyebrow">${areaName(areaOf(pq.goal))}</span><h3>${esc(goalName(pq.goal))}</h3><span class="note">${esc(goalDesc(pq.goal))} ${t("goalLink")} ›</span></button>`;
    if (wantsRef && hits[0]) body += `<div class="card"><span class="eyebrow">${t("refProduct")}</span>${prow(hits[0], null, {})}<button class="more" data-product="${hits[0]}" data-tab="${pq.intent}" data-orig="${pq.origin || ""}" style="background:var(--dark-chip);color:var(--dark-chip-ink);border:0;font-weight:700">${pq.intent === "cheaper" ? t("showCheaper") : t("showSimilar")}${pq.origin ? ` · ${mktName(pq.origin)}` : ""}</button></div>`;
    body += hits.length ? `<div><span class="lbl">${hits.length} ${t("products")}</span><div class="plist">${hits.slice(0, 12).map((id) => prow(id, null, {})).join("")}</div></div>` : (!pq.goal ? `<div class="empty">${t("noMatch")}</div>` : "");
  }
  return `<section class="sec" style="padding-top:14px">
      <form class="sbox" id="sform" role="search"><input id="sq" type="search" value="${esc(S.q)}" autocomplete="off" placeholder="${t("searchPh")}" aria-label="${t("search")}"><button type="submit" aria-label="${t("search")}">${I.search}</button></form>
      <div class="chips">${EXAMPLES[S.lang].map((x) => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      ${body}</section>`;
}

/* ---------------- insight ---------------- */
function barChart({ labels, values, max, ticks, fmtv, neg = false, color }) {
  const W = 340, H = 200, L = 50, R = 10, Tp = 16, B = 26, ph = H - Tp - B, pw = W - L - R;
  const slot = pw / values.length, bw = Math.min(40, slot * 0.56);
  const y = (v) => neg ? Tp + (Math.abs(v) / max) * ph : Tp + ph - (v / max) * ph, zero = neg ? Tp : Tp + ph;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (const tk of ticks) { const yy = y(tk); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtv(tk)}</text>`; }
  values.forEach((v, i) => {
    const cx = L + slot * i + slot / 2;
    if (v != null) { const top = Math.min(y(v), zero), h = Math.abs(y(v) - zero); s += `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="4" fill="${color}"/><text class="v" x="${cx}" y="${neg ? top + h + 13 : top - 5}" text-anchor="middle">${fmtv(v)}</text>`; }
    s += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${labels[i]}</text>`;
  });
  return s + `</svg>`;
}
function vInsight() {
  const X = PROSE[S.lang], F = D.market.financials, E = D.market.events, Fa = D.market.facts;
  const co = (c) => F.filter((r) => r.company === c).sort((a, b) => a.fiscal_year - b.fiscal_year);
  const sep = co("sephora_korea"), oy = co("cj_olive_young");
  const u = { ko: ["억", "조"], zh: ["亿", "万亿"], ja: ["億", "兆"], en: ["", ""] }[S.lang];
  const lossFmt = (v) => isEn() ? `₩${(v / 10).toFixed(1)}bn` : `${Math.round(v)}${u[0]}`;
  const revFmt = (v) => isEn() ? `₩${v % 1 ? v.toFixed(1) : v}tn` : `${v % 1 ? v.toFixed(1) : v}${u[1]}`;
  const sepC = barChart({ labels: sep.map((r) => r.fiscal_year), values: sep.map((r) => r.operating_profit_krw ? +r.operating_profit_krw / 1e8 : null), max: 200, ticks: [0, -100, -200], fmtv: lossFmt, neg: true, color: "var(--up)" });
  const oyC = barChart({ labels: oy.map((r) => r.fiscal_year), values: oy.map((r) => r.revenue_krw ? +r.revenue_krw / 1e12 : null), max: 6, ticks: [0, 2, 4, 6], fmtv: revFmt, color: "var(--accent)" });
  const host = (url) => { try { return new URL(url).hostname.replace(/^(www|m|view|biz)\./, ""); } catch (e) { return "source"; } };
  const d = (e) => e.date_precision === "year" ? e.event_date.slice(0, 4) : e.date_precision === "month" ? e.event_date.slice(0, 7).replace("-", ".") : dateFmt(e.event_date);
  const factName = (f) => S.lang === "ko" ? f.metric_ko : isEn() ? f.metric : FACT_TX[f.metric]?.[S.lang] || f.metric;
  const factVal = (f) => S.lang === "ko" ? f.value_ko : isEn() ? f.value : VALUE_TX[f.value]?.[S.lang] || f.value;
  const evName = (e) => S.lang === "ko" ? e.event_ko : isEn() ? e.event : EVENT_TX[e.event]?.[S.lang] || e.event;
  const factRows = (c) => Fa.filter((f) => f.company === c).map((f) => `<tr><td>${esc(factName(f))}</td><td class="n">${esc(factVal(f))}</td><td class="n"><a class="src" href="${esc(f.source_url)}" target="_blank" rel="noopener">${esc(f.as_of)}</a></td></tr>`).join("");
  return `<section class="sec" style="padding-top:18px">
      <span class="eyebrow">${t("insightK")}</span><h1>${X.iTitle}</h1>
      <div class="prose"><p>${X.iLead}</p></div><p class="warn">${X.iWarn}</p></section>
    <section class="sec"><div class="two">
      <div class="card"><h3>${X.sepT}</h3>${sepC}<p class="note">${X.sepN}</p></div>
      <div class="card"><h3>${X.oyT}</h3>${oyC}<p class="note">${X.oyN}</p></div>
    </div></section>
    <section class="sec"><div class="two">
      <div><h3 style="margin:0 0 10px">${X.names.sephora_korea}</h3><div class="tbl"><table><tbody>${factRows("sephora_korea")}</tbody></table></div></div>
      <div><h3 style="margin:0 0 10px">${X.names.cj_olive_young}</h3><div class="tbl"><table><tbody>${factRows("cj_olive_young")}</tbody></table></div></div>
    </div></section>
    <section class="sec">${secHead(X.tl)}<div class="tl">${E.slice().sort((a, b) => a.event_date.localeCompare(b.event_date)).map((e) => `<div class="ev"><time>${d(e)}</time><span><span class="co ${e.company}">${X.names[e.company]}</span>${esc(evName(e))} <a class="src" href="${esc(e.source_url)}" target="_blank" rel="noopener">${host(e.source_url)}</a></span></div>`).join("")}</div></section>
    <section class="sec">${secHead(X.fin)}<div class="tbl"><table><thead><tr><th>${X.co}</th><th class="n">${X.yr}</th><th class="n">${X.rev}</th><th class="n">${X.op}</th><th class="n">${X.ni}</th><th class="n">${X.st}</th><th>${X.src}</th></tr></thead><tbody>
      ${F.map((r) => `<tr><td>${X.names[r.company]}</td><td class="n">${r.fiscal_year}</td><td class="n">${bigWon(r.revenue_krw)}</td><td class="n">${bigWon(r.operating_profit_krw)}</td><td class="n">${bigWon(r.net_income_krw)}</td><td class="n">${r.store_count ? fmtNum(r.store_count) : "–"}</td><td><a class="src" href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_document)}</a>${r.notes ? `<div class="note">${esc(r.notes)}</div>` : ""}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="sec prose">${secHead(X.link)}<p>${X.p1}</p><p>${X.p2}</p>
      <button class="more" data-go="method">${t("methodLink")} ${I.right}</button></section>`;
}

function vMethod() {
  const X = PROSE[S.lang], W = D.config.weights, M = D.config.modes;
  return `<section class="sec" style="padding-top:18px"><span class="eyebrow">${t("method")}</span><h1>${X.mTitle}</h1><div class="prose"><p>${X.mLead}</p></div></section>
    <section class="sec">${secHead(X.mW)}

      <p class="note">${X.mWN}</p></section>

      <p class="note">${X.mMN}</p></section>
    <section class="sec prose">${secHead(X.mD)}<p>${X.mDN}</p></section>
    <section class="sec prose">${secHead(X.mH)}<p><b>H1</b> ${X.h1}</p><p><b>H2</b> ${X.h2}</p><p><b>H3</b> ${X.h3}</p></section>`;
}

/* ---------------- category sheet ---------------- */
function renderSheet() {
  const el = document.getElementById("sheet");
  if (!S.sheet) { el.innerHTML = ""; return; }
  const cur = S.sheet === "home" ? S.hcat : S.cat;
  const openG = S.sheetOpen ?? Object.entries(D.codebook.groups).find(([g, cs]) => g === cur || cs.includes(cur))?.[0];
  el.innerHTML = `<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${t("allCats")}"><div class="handle"></div>
    <div class="acc"><button aria-expanded="true" style="font-weight:700">${t("all")}</button><div class="chips"><button class="chip" data-pickcat="" aria-pressed="${!cur}">${t("allCats")}</button></div></div>
    ${Object.entries(D.codebook.groups).map(([g, cs]) => `<div class="acc"><button data-accg="${g}" aria-expanded="${openG === g}">${grpName(g)} ${I.chev}</button>
      ${openG === g ? `<div class="chips"><button class="chip" data-pickcat="${g}" aria-pressed="${cur === g}">${grpName(g)} · ${t("all")}</button>${cs.map((c) => `<button class="chip" data-pickcat="${c}" aria-pressed="${cur === c}">${catName(c)}</button>`).join("")}</div>` : ""}</div>`).join("")}
  </div>`;
}

/* ---------------- render + events ---------------- */
const VIEWS = { home: vHome, ranking: vRanking, goals: vGoals, insight: vInsight, method: vMethod, product: vProduct, search: vSearch };
function render() {
  const ae = document.activeElement, keep = ae && ae.id ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd } : null;
  header();
  document.getElementById("main").innerHTML = VIEWS[S.view]();
  document.getElementById("foot").innerHTML = `<span>${D.mode === "real" ? t("realFooter1") : t("footer1")}</span><span>${t("footer2")}</span><span><button data-go="method">${t("methodLink")}</button> · ${D.mode === "real" ? t("labelsNote") : t("demo")}</span>`;
  renderSheet();
  document.documentElement.lang = S.lang;
  const track = document.getElementById("btrack");
  if (track) track.addEventListener("scroll", () => { const i = Math.round(track.scrollLeft / track.clientWidth); document.getElementById("bcount").textContent = `${i + 1}/${track.children.length}`; }, { passive: true });
  const names = { product: prodName(P(S.pid)), goals: goalName(S.goal), ranking: t("ranking"), insight: t("insight"), method: t("method"), search: t("search") };
  document.title = names[S.view] ? `${names[S.view]} · Beauty Bridge` : "Beauty Bridge";
  if (keep && keep.id === "rtext") { const el = document.getElementById("rtext"); if (el) { el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch (e) {} } }
  persist();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-close]"); if (!b) return;
  const d = b.dataset;
  if (d.close) { S.sheet = false; S.sheetOpen = undefined; renderSheet(); return; }
  if (d.pickcat !== undefined) { if (S.sheet === "home") S.hcat = d.pickcat; else S.cat = d.pickcat; S.sheet = false; S.sheetOpen = undefined; render(); return; }
  if (d.accg) { S.sheetOpen = S.sheetOpen === d.accg ? "" : d.accg; renderSheet(); return; }
  if (d.sheet) { S.sheet = d.sheet; S.sheetOpen = undefined; renderSheet(); return; }
  if (d.product) { LIVE.msg = ""; go("product", { pid: d.product, ptab: d.tab || "similar", origin: d.orig || "", draft: null }); return; }
  if (d.goal) { go("goals", { goal: d.goal, area: areaOf(d.goal), gskin: "" }); return; }
  if (d.go) { const extra = {}; if (d.rtab) extra.rtab = d.rtab; if (d.cat !== undefined) extra.cat = d.cat; if (d.skin) extra.skin = d.skin; if (d.go === "ranking" && d.rtab === "goal") extra.area = areaOf(S.goal); go(d.go, extra); return; }
  if (d.rtab) { S.rtab = d.rtab; go("ranking"); return; }
  if (d.garea) { go("goals", { area: d.garea, goal: goalsIn(d.garea)[0], gskin: "" }); return; }
  if (d.ptab) { S.ptab = d.ptab; LIVE.msg = ""; render(); return; }
  if (d.rstar) { S.draft.rating = +d.rstar; render(); return; }
  if (d.rskin) { S.draft.skin_type = S.draft.skin_type === d.rskin ? null : d.rskin; render(); return; }
  if (d.rage) { S.draft.age_band = S.draft.age_band === d.rage ? null : d.rage; render(); return; }
  if (d.rmkt) { S.draft.market = d.rmkt; render(); return; }
  if (d.rsubmit) { saveReview(false); return; }
  if (d.rdelete) { saveReview(true); return; }
  if (d.age) { S.age = d.age; render(); return; }
  if (d.lmkt) { S.lmkt = d.lmkt; render(); return; }
  if (d.origin !== undefined) { S.origin = d.origin; render(); return; }
  if (d.skin) { S.skin = d.skin; render(); return; }
  if (d.gskin !== undefined) { S.gskin = d.gskin; render(); return; }
  if (d.rarea) { S.area = d.rarea; S.goal = goalsIn(d.rarea)[0]; render(); return; }
  if (d.rgoal) { S.goal = d.rgoal; render(); return; }
  if (d.harea) { S.harea = d.harea; S.hgoal = goalsIn(d.harea)[0]; render(); return; }
  if (d.hskin) { S.hskin = d.hskin; render(); return; }
  if (d.hgoal) { S.hgoal = d.hgoal; render(); return; }
  if (d.q) { go("search", { q: d.q }); return; }
  if (d.setmarket) { S.market = d.setmarket; render(); return; }
});
document.addEventListener("toggle", (e) => { const el = e.target; if (el.matches && el.matches("details.res")) S.open[el.dataset.key] = el.open; }, true);
document.addEventListener("input", (e) => { if (e.target.id === "rtext" && S.draft) S.draft.text = e.target.value; });
document.addEventListener("submit", (e) => { if (e.target.id !== "sform") return; e.preventDefault(); go("search", { q: document.getElementById("sq").value }); });
document.addEventListener("change", (e) => {
  if (e.target.id === "mkt") { S.market = e.target.value; render(); }
  if (e.target.id === "lang") { S.lang = e.target.value; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = false; renderSheet(); } });

if (!D.products[S.pid]) S.pid = D.featured[0];
fromHash();
if (S.view !== "goals") S.area = areaOf(S.goal);
render();
initLive();
</script>
